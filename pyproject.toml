[project]
name = "mcpwn"
version = "0.1.0"
description = "Red teaming framework that proves whether an MCP agent can be hijacked"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["mcp", "security", "red-team", "prompt-injection", "ai-security", "agent"]
dependencies = ["mcp>=1.9", "typer>=0.12", "rich>=13.7"]

[project.scripts]
mcpwn = "mcpwn.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpwn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
