[project]
name = "mcpbait"
version = "0.2.0"
description = "Red teaming framework that proves whether an MCP agent can be hijacked"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["mcp", "security", "red-team", "prompt-injection", "ai-security", "agent"]
dependencies = ["mcp>=2.1", "typer>=0.12", "rich>=13.7", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/jankesec/mcpbait"
Documentation = "https://github.com/jankesec/mcpbait/tree/main/docs/techniques"
Issues = "https://github.com/jankesec/mcpbait/issues"
Changelog = "https://github.com/jankesec/mcpbait/releases"

[project.scripts]
mcpbait = "mcpbait.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pytest-cov>=5", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpbait"]
# PEP 561: ship the inline types rather than making consumers guess.
artifacts = ["src/mcpbait/py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Curated rather than exhaustive. ARG and PL are deliberately excluded: between
# them they raise 65 findings that are all correct-by-design here -- ARG002 on the
# unused `ctx` parameter the AttackModule interface requires, PLC0415 on the CLI's
# deliberate lazy imports, and PLR2004 on ordinary numeric assertions in tests.
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF", "S", "TID", "ERA"]

[tool.ruff.lint.per-file-ignores]
# assert is the right tool in a test.
"tests/**" = ["S101"]
# Planting plausible fake credentials is this tool's entire job. The linter is
# right to spot them; here they are the product, not a finding.
"src/mcpbait/modules/bait_secrets.py" = ["S105", "S106"]
"src/mcpbait/workspace.py" = ["S105", "S106"]
# These two render embedded HTML, CSS and SVG. Wrapping a style attribute or a
# path element to satisfy a line limit costs readability and buys nothing.
"src/mcpbait/report.py" = ["E501", "W293"]
"src/mcpbait/badge.py" = ["E501"]

[tool.coverage.run]
source = ["src/mcpbait"]
branch = true

[tool.coverage.report]
# Held at the level the suite already reaches, so the gate catches a regression
# rather than blessing today's gaps. Raised to 92 once the install paths are covered.
fail_under = 88
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/mcpbait"]
warn_unreachable = true

[[tool.mypy.overrides]]
# The mcp package does not ship complete inline types yet. The override is scoped to
# the import boundary so nothing downstream of it silently becomes Any.
module = ["mcp.*"]
ignore_missing_imports = true
