name: release

# Publishes to PyPI when a version tag is pushed, using Trusted Publishing:
# GitHub proves the workflow's identity to PyPI over OIDC, so there is no API
# token stored in the repository, in a secret, or pasted anywhere.
#
# One-time setup at https://pypi.org/manage/project/mcpbait/settings/publishing/
# (or https://pypi.org/manage/account/publishing/ before the first release):
#   Owner: jankesec   Repository: mcpbait
#   Workflow: release.yml   Environment: pypi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          python-version: "3.12"
      # --frozen so the release is built from the committed lockfile rather than
      # whatever resolves on the day.
      - run: uv sync --all-extras --dev --frozen
      # The same gates as ci.yml. A tag that would fail CI must not reach PyPI
      # merely because the release workflow asked fewer questions.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q --cov
      - run: uv build
      # Publish the artefact that was actually tested. Rebuilding in the publish job
      # would ship a wheel no job in this run ever exercised.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    # A tag that fails its own test suite must never reach PyPI: releases cannot
    # be replaced, only yanked.
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Job-level permissions replace the workflow-level block rather than
      # merging with it, so contents:read is restated here for the checkout.
      contents: read
      # The whole point: mints the short-lived OIDC token PyPI trusts.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Generate SBOM
        # `cyclonedx-py environment` with no path describes the environment it is
        # itself running in -- under uvx, that is cyclonedx's own ephemeral venv, not
        # mcpbait. Exporting the locked dependency set first is what makes the SBOM
        # describe this project. --no-emit-project drops the `-e .` self-reference,
        # which has no pinned version and would otherwise land as an "unknown" component.
        run: |
          uv export --no-dev --frozen --no-emit-project --format requirements-txt -o requirements.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements requirements.txt --of JSON -o sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.json
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # Explicit rather than inherited: the artifact ships with a signed
          # provenance attestation tying it to this workflow and this tag.
          attestations: true
