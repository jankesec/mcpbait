name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "38 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the workflow-level block rather than
      # merging with it, so contents:read is restated here for the checkout.
      contents: read
      # Uploads the SARIF to the code-scanning dashboard.
      security-events: write
      # Signs the published result over OIDC. No token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Scorecard reads the repo but must never be able to write to it.
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Required for the public badge and the OpenSSF API to have anything
          # to serve. Publishes the score only, not repository contents.
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: results.sarif
