name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "38 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the workflow-level block rather than
      # merging with it, so contents:read is restated here for the checkout.
      contents: read
      # Uploads the SARIF to the code-scanning dashboard.
      security-events: write
      # Signs the published result over OIDC. No token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Scorecard reads the repo but must never be able to write to it.
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Required for the public badge and the OpenSSF API to have anything
          # to serve. Publishes the score only, not repository contents.
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d  # v3.37.9
        with:
          sarif_file: results.sarif
